name: Remote provider compatibility

# Verifies the live ip.serviss.it service (the default provider) still returns
# the schema ServissItProvider expects. Runs on a schedule rather than on PRs
# because it depends on the network and a third-party service.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remote:
    name: Remote compatibility test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, mbstring, curl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: Run remote compatibility test
        run: composer test:remote

      - name: Open or update tracking issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Remote provider compatibility check failing';
            const label = 'remote-compat';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled remote compatibility test failed — the ip.serviss.it response may no longer match \`ServissItProvider\`'s expected schema.\n\nFailed run: ${runUrl}`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }
